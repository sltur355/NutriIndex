# docker-compose.yml
version: '3.8'

services:
  # MinIO services
  minio1:
    image: quay.io/minio/minio:latest
    command: server --console-address ":9001" http://minio{1...4}/data{1...2}
    environment:
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio124
    expose:
      - "9000"
      - "9001"
    hostname: minio1
    volumes:
      - data1-1:/data1
      - data1-2:/data2

  minio2:
    image: quay.io/minio/minio:latest
    command: server --console-address ":9001" http://minio{1...4}/data{1...2}
    environment:
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio124
    expose:
      - "9000"
      - "9001"
    hostname: minio2
    volumes:
      - data2-1:/data1
      - data2-2:/data2

  minio3:
    image: quay.io/minio/minio:latest
    command: server --console-address ":9001" http://minio{1...4}/data{1...2}
    environment:
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio124
    expose:
      - "9000"
      - "9001"
    hostname: minio3
    volumes:
      - data3-1:/data1
      - data3-2:/data2

  minio4:
    image: quay.io/minio/minio:latest
    command: server --console-address ":9001" http://minio{1...4}/data{1...2}
    environment:
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio124
    expose:
      - "9000"
      - "9001"
    hostname: minio4
    volumes:
      - data4-1:/data1
      - data4-2:/data2

  nginx:
    image: nginx:alpine
    hostname: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9000:9000"
      - "9001:9001"
    depends_on:
      - minio1
      - minio2
      - minio3
      - minio4
  
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass password
    volumes:
      - redis_data:/data

  # Adminer service
  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  data1-1:
  data1-2:
  data2-1:
  data2-2:
  data3-1:
  data3-2:
  data4-1:
  data4-2:
  redis_data: